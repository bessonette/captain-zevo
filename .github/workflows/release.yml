name: Release

# Builds installers for a version tag (v0.1.0) and attaches them to a draft
# GitHub release. The installers are not code-signed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux libraries for the desktop app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan1 libasound2-dev libssl-dev clang cmake
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build the app and the command-line tool
        run: cargo build --release -p zevo-app -p zevo-cli
      - name: Build installers
        working-directory: crates/zevo-app
        run: cargo packager --release
      - name: Collect files
        shell: bash
        run: |
          mkdir -p upload
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -exec cp {} upload/ \;
          cli=target/release/zevo
          if [ "$RUNNER_OS" = "Windows" ]; then cli=target/release/zevo.exe; fi
          cp "$cli" "upload/zevo-cli-${RUNNER_OS}-${RUNNER_ARCH}$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )"
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: captain-zevo-${{ matrix.os }}
          path: upload/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: upload/*
